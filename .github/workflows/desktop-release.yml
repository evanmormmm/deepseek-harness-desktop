name: Windows desktop

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'README.md'
      - 'README.zh.md'
      - 'apps/cli/**'
      - 'apps/desktop/**'
      - 'scripts/*desktop-windows*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Verify source and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run source and documentation gates
        run: |
          pnpm run typecheck:contracts-ready
          pnpm run lint:contracts-ready
          pnpm run constraints
          pnpm run doc-sync

  build:
    name: Build and verify Windows x64 assets
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release assets
        run: pnpm run desktop:package

      - uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-desktop-windows-x64
          path: .artifacts/desktop-release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: deepseek-harness-desktop-windows-x64
          path: dist

      - name: Verify tag matches desktop version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' apps/desktop/DeepSeekHarness.Desktop.csproj)"
          [ "$RELEASE_TAG" = "desktop-v$version" ] || {
            echo "::error::Tag $RELEASE_TAG does not match desktop version $version"
            exit 1
          }

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --title "DeepSeek Harness Desktop $version" \
            --notes-file apps/desktop/RELEASE_NOTES.md \
            --verify-tag
